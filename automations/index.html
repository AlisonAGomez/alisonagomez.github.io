<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="../" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automações | Alison Gomez</title>
  <meta name="description" content="Automações de Alison Gomez para backup, suporte, infraestrutura, monitoramento e segurança defensiva." />
  <meta name="theme-color" content="#07111f" />
  <link rel="canonical" href="https://alisonagomez.github.io/automations/" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="stylesheet" href="style.css?v=43" />
</head>

<body>
  <a class="skip-link" href="#automationsRoot">Pular para o conteúdo</a>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="./#home" aria-label="Alison Gomez, início">
        <span class="brand-mark">AG</span>
        <span class="brand-copy"><strong>Alison Gomez</strong><small>Segurança · Infraestrutura · Automação</small></span>
      </a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu" aria-controls="mainNavigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="mainNavigation" aria-label="Navegação principal">
        <a href="./#home">Início</a>
        <a href="./#cases">Cases</a>
        <a href="projects/">Projetos</a>
        <a href="automations/" aria-current="page">Automações</a>
        <a href="reports/">Relatórios</a>
        <a href="./#contato">Contato</a>
      </nav>
    </div>
  </header>

  <main class="page-shell" id="automationsRoot" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container">
      <p><strong>Alison Gomez</strong> · Automações operacionais</p>
      <p>© <span id="year"></span></p>
    </div>
  </footer>

  <script src="script.js?v=43"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const automationId = params.get("id");
    const root = document.getElementById("automationsRoot");

    const escapeHtml = (value = "") => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    function statusClass(status = "") {
      if (/publicado|concluído|finalizado/i.test(status)) return "status-complete";
      if (/desenvolvimento|andamento/i.test(status)) return "status-progress";
      return "status-info";
    }

    function renderTags(items = [], limit = items.length) {
      const safeItems = Array.isArray(items) ? items : [];
      const visible = safeItems.slice(0, limit);
      const remaining = safeItems.length - visible.length;
      return `<div class="tag-list">${visible.map(item => `<span>${escapeHtml(item)}</span>`).join("")}${remaining > 0 ? `<span>+${remaining} tecnologias</span>` : ""}</div>`;
    }

    function renderList(items = []) {
      if (!Array.isArray(items) || !items.length) return "";
      return `<ul>${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function hasPublicRepository(item) {
      return Boolean(item.repository) && item.repository !== "https://github.com/AlisonAGomez";
    }

    function repositoryAction(item, label = "Ver repositório") {
      if (hasPublicRepository(item)) {
        return `<a href="${escapeHtml(item.repository)}" target="_blank" rel="noreferrer">${escapeHtml(label)}</a>`;
      }
      return `<span class="private-note">Código privado ou parcialmente omitido por conter integrações e informações de ambiente.</span>`;
    }

    function catalogCard(item, index) {
      const benefit = item.benefit || item.features?.[0] || item.summary;
      const media = item.preview
        ? `<a class="catalog-media" href="automations/?id=${encodeURIComponent(item.id)}" tabindex="-1" aria-hidden="true"><img src="${escapeHtml(item.preview)}" alt="" loading="lazy" /></a>`
        : "";
      return `
        <article class="catalog-card ${index === 0 ? "is-featured" : ""}">
          ${media}
          <div class="catalog-body">
            <div class="case-meta"><span>${escapeHtml(item.category)}</span><b class="status ${statusClass(item.status)}">${escapeHtml(item.status)}</b></div>
            <h2><a href="automations/?id=${encodeURIComponent(item.id)}">${escapeHtml(item.title)}</a></h2>
            <p class="catalog-benefit">${escapeHtml(benefit)}</p>
            <p class="catalog-summary">${escapeHtml(item.summary)}</p>
            ${renderTags(item.tags, 3)}
            <div class="catalog-actions"><a href="automations/?id=${encodeURIComponent(item.id)}">Ver detalhes</a>${hasPublicRepository(item) ? repositoryAction(item, "GitHub") : ""}</div>
          </div>
        </article>
      `;
    }

    function renderCatalog(items) {
      document.title = "Automações | Alison Gomez";
      root.innerHTML = `
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="./">Início</a><span aria-hidden="true">/</span><span aria-current="page">Automações</span></nav>
        <header class="catalog-header">
          <p class="section-label">Automação aplicada</p>
          <h1>Ferramentas para reduzir trabalho manual e risco operacional</h1>
          <p>Cada item apresenta o problema, o processamento, a saída, os erros tratados e as evidências disponíveis. Integrações privadas permanecem omitidas quando necessário.</p>
        </header>
        <div class="catalog-grid">${items.map(catalogCard).join("")}</div>
      `;
    }

    function renderGallery(items = []) {
      if (!Array.isArray(items) || !items.length) return "";
      return `
        <section class="detail-section" id="evidencias">
          <h2>Galeria e evidências</h2>
          <div class="evidence-grid">
            ${items.map(image => `
              <figure>
                <a href="${escapeHtml(image.src)}" target="_blank" rel="noreferrer"><img src="${escapeHtml(image.src)}" alt="${escapeHtml(image.alt)}" loading="lazy" /></a>
                <figcaption><strong>${escapeHtml(image.title)}</strong><span>${escapeHtml(image.description)}</span></figcaption>
              </figure>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderSections(sections = []) {
      if (!Array.isArray(sections)) return "";
      return sections.map((section, index) => {
        const id = section.id || `secao-${index + 1}`;
        const body = section.items ? renderList(section.items) : `<p>${escapeHtml(section.text || "")}</p>`;
        return `<section class="detail-section" id="${escapeHtml(id)}"><h2>${escapeHtml(section.title)}</h2>${body}</section>`;
      }).join("");
    }

    function renderNotFound() {
      document.title = "Automação não encontrada | Alison Gomez";
      root.innerHTML = `
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="./">Início</a><span aria-hidden="true">/</span><a href="automations/">Automações</a><span aria-hidden="true">/</span><span aria-current="page">Não encontrada</span></nav>
        <section class="detail-hero content-not-found"><p class="section-label">Automação não encontrada</p><h1>Este conteúdo não está disponível.</h1><p class="detail-lead">Confira o catálogo para acessar as automações atuais.</p><div class="detail-top-actions"><a href="automations/">Ver automações</a><a href="./#cases">Ver cases</a></div></section>
      `;
    }

    function renderAutomation(item, items) {
      const details = item.details || {};
      const sections = Array.isArray(details.sections) ? details.sections : [];
      const nextItem = items[(items.indexOf(item) + 1) % items.length];
      const benefit = item.benefit || item.features?.[0] || item.summary;
      const toc = sections.map((section, index) => `<a href="#${escapeHtml(section.id || `secao-${index + 1}`)}">${escapeHtml(section.title)}</a>`).join("");
      const repo = repositoryAction(item);

      document.title = `${item.title} | Alison Gomez`;
      root.innerHTML = `
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="./">Início</a><span aria-hidden="true">/</span><a href="automations/">Automações</a><span aria-hidden="true">/</span><span aria-current="page">${escapeHtml(item.title)}</span></nav>
        <div class="detail-layout">
          <article class="detail-main">
            <header class="detail-hero">
              <p class="section-label">${escapeHtml(item.category)}</p>
              <h1>${escapeHtml(item.title)}</h1>
              <p class="detail-lead">${escapeHtml(item.subtitle)}</p>
              <div class="detail-meta"><span>${escapeHtml(item.status)}</span><span>${escapeHtml(item.language)}</span><span>${escapeHtml(item.date)}</span></div>
              ${renderTags(item.tags)}
              <div class="detail-top-actions">${repo}<a href="#evidencias">Ver evidências</a></div>
            </header>

            <nav class="detail-toc" aria-label="Sumário da automação"><strong>Nesta página</strong><a href="#resumo">Resumo executivo</a><a href="#fluxo">Entradas e saídas</a>${toc}<a href="#evidencias">Galeria</a><a href="#tecnologias">Tecnologias</a></nav>

            <section class="detail-section" id="resumo"><h2>Resumo executivo</h2><p>${escapeHtml(details.overview || item.summary)}</p><p><strong>Benefício:</strong> ${escapeHtml(benefit)}</p></section>
            <section class="detail-section" id="fluxo">
              <h2>Fluxo operacional</h2>
              <dl class="case-facts">
                <div><dt>Ambiente</dt><dd>${escapeHtml(item.audience || item.category)}</dd></div>
                <div><dt>Entrada</dt><dd>${escapeHtml(item.input || "Dados e parâmetros do ambiente configurado.")}</dd></div>
                <div><dt>Processamento</dt><dd>${escapeHtml(item.summary)}</dd></div>
                <div><dt>Saída</dt><dd>${escapeHtml(item.output || item.features?.slice(-1)[0] || "Relatório técnico para revisão.")}</dd></div>
                <div><dt>Risco reduzido</dt><dd>${escapeHtml(item.risk || benefit)}</dd></div>
              </dl>
            </section>

            ${renderSections(sections)}
            ${!sections.length ? `<section class="detail-section" id="funcionalidades"><h2>Funcionalidades</h2>${renderList(item.features)}</section>` : ""}
            ${renderGallery(item.gallery)}
            <section class="detail-section" id="tecnologias"><h2>Tecnologias usadas</h2>${renderTags(item.tech || item.tags)}</section>
            <section class="detail-section"><h2>Continuar navegando</h2><p>Próxima automação: <a class="text-link" href="automations/?id=${encodeURIComponent(nextItem.id)}">${escapeHtml(nextItem.title)} →</a></p><div class="detail-top-actions">${repo}<a href="automations/">Voltar ao catálogo</a></div></section>
          </article>

          <aside class="detail-aside" aria-label="Resumo da automação">
            <section class="aside-card"><h2>Impacto</h2><p>${escapeHtml(benefit)}</p></section>
            <section class="aside-card"><h2>Entrega</h2><p>${escapeHtml(item.output || item.features?.slice(-1)[0] || "Evidências técnicas para revisão.")}</p></section>
            <section class="aside-card"><h2>Disponibilidade</h2>${hasPublicRepository(item) ? `<p>Código e documentação pública no GitHub.</p>` : `<p>Código privado ou parcialmente omitido por conter integrações e informações de ambiente. A página apresenta fluxo, evidências sanitizadas e resultados.</p>`}</section>
          </aside>
        </div>
      `;
    }

    fetch("assets/automations/automations.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(items => {
        if (!Array.isArray(items) || !items.length) throw new Error("Catálogo vazio");
        if (!automationId) {
          renderCatalog(items);
          return;
        }
        const item = items.find(entry => entry.id === automationId);
        item ? renderAutomation(item, items) : renderNotFound();
      })
      .catch(error => {
        root.innerHTML = `<section class="report-empty"><h1>Não foi possível carregar as automações.</h1><p>${escapeHtml(error.message)}</p></section>`;
      });
  </script>
</body>
</html>

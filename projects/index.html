<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="../" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projetos | Alison Gomez</title>
  <meta name="description" content="Projetos de segurança defensiva, análise de logs, automação e desenvolvimento aplicado de Alison Gomez." />
  <meta name="theme-color" content="#07111f" />
  <link rel="canonical" href="https://alisonagomez.github.io/projects/" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="stylesheet" href="style.css?v=43" />
</head>

<body>
  <a class="skip-link" href="#projectsRoot">Pular para o conteúdo</a>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="./#home" aria-label="Alison Gomez, início">
        <span class="brand-mark">AG</span>
        <span class="brand-copy"><strong>Alison Gomez</strong><small>Segurança · Infraestrutura · Automação</small></span>
      </a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu" aria-controls="mainNavigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="mainNavigation" aria-label="Navegação principal">
        <a href="./#home">Início</a>
        <a href="./#cases">Cases</a>
        <a href="projects/" aria-current="page">Projetos</a>
        <a href="automations/">Automações</a>
        <a href="reports/">Relatórios</a>
        <a href="./#contato">Contato</a>
      </nav>
    </div>
  </header>

  <main class="page-shell" id="projectsRoot" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container">
      <p><strong>Alison Gomez</strong> · Projetos técnicos</p>
      <p>© <span id="year"></span></p>
    </div>
  </footer>

  <script src="script.js?v=43"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const projectId = params.get("id");
    const root = document.getElementById("projectsRoot");
    const canonical = document.querySelector('link[rel="canonical"]');
    const description = document.querySelector('meta[name="description"]');

    const escapeHtml = (value = "") => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    function statusClass(status = "") {
      if (/publicado|concluído|finalizado/i.test(status)) return "status-complete";
      if (/desenvolvimento|andamento|parcial/i.test(status)) return "status-progress";
      return "status-info";
    }

    function renderTags(items = [], limit = items.length) {
      const safeItems = Array.isArray(items) ? items : [];
      const visible = safeItems.slice(0, limit);
      const remaining = safeItems.length - visible.length;
      return `<div class="tag-list">${visible.map(item => `<span>${escapeHtml(item)}</span>`).join("")}${remaining > 0 ? `<span>+${remaining} tecnologias</span>` : ""}</div>`;
    }

    function renderList(items = []) {
      if (!Array.isArray(items) || !items.length) return "";
      return `<ul>${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function renderSection(id, title, content) {
      if (!content || (Array.isArray(content) && !content.length)) return "";
      const body = Array.isArray(content) ? renderList(content) : `<p>${escapeHtml(content)}</p>`;
      return `<section class="detail-section" id="${id}"><h2>${title}</h2>${body}</section>`;
    }

    function renderArchitecture(items = []) {
      if (!Array.isArray(items) || !items.length) return "";
      return `
        <section class="detail-section" id="arquitetura">
          <h2>Arquitetura e fluxo</h2>
          <div class="architecture-flow">
            ${items.map((item, index) => `${index ? "<b aria-hidden=\"true\">→</b>" : ""}<span>${escapeHtml(item)}</span>`).join("")}
          </div>
        </section>
      `;
    }

    function renderGallery(items = []) {
      if (!Array.isArray(items) || !items.length) return "";
      return `
        <section class="detail-section" id="evidencias">
          <h2>Evidências visuais</h2>
          <div class="evidence-grid">
            ${items.map(image => `
              <figure>
                <a href="${escapeHtml(image.src)}" target="_blank" rel="noreferrer">
                  <img src="${escapeHtml(image.src)}" alt="${escapeHtml(image.alt)}" loading="lazy" />
                </a>
                <figcaption><strong>${escapeHtml(image.title)}</strong><span>${escapeHtml(image.description)}</span></figcaption>
              </figure>
            `).join("")}
          </div>
        </section>
      `;
    }

    function catalogCard(project, index) {
      const target = project.detailUrl || `projects/?id=${encodeURIComponent(project.id)}`;
      const media = project.preview
        ? `<a class="catalog-media" href="${escapeHtml(target)}" tabindex="-1" aria-hidden="true"><img src="${escapeHtml(project.preview)}" alt="" loading="lazy" /></a>`
        : "";
      return `
        <article class="catalog-card ${index === 0 ? "is-featured" : ""}">
          ${media}
          <div class="catalog-body">
            <div class="case-meta"><span>${escapeHtml(project.category)}</span><b class="status ${statusClass(project.status)}">${escapeHtml(project.status)}</b></div>
            <h2><a href="${escapeHtml(target)}">${escapeHtml(project.title)}</a></h2>
            <p class="catalog-benefit">${escapeHtml(project.benefit)}</p>
            <p class="catalog-summary">${escapeHtml(project.summary)}</p>
            ${renderTags(project.tags, 3)}
            <div class="catalog-actions"><a href="${escapeHtml(target)}">Ver detalhes</a></div>
          </div>
        </article>
      `;
    }

    function renderCatalog(projects) {
      document.title = "Projetos | Alison Gomez";
      canonical.href = "https://alisonagomez.github.io/projects/";
      root.innerHTML = `
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="./">Início</a><span aria-hidden="true">/</span><span aria-current="page">Projetos</span></nav>
        <header class="catalog-header">
          <p class="section-label">Projetos técnicos</p>
          <h1>Segurança, automação e desenvolvimento aplicado</h1>
          <p>Projetos apresentados com problema, benefício, estado real e limitações. O Auditor tem sua página canônica no catálogo de automações.</p>
        </header>
        <div class="catalog-grid">${projects.map(catalogCard).join("")}</div>
      `;
    }

    function renderNotFound() {
      document.title = "Projeto não encontrado | Alison Gomez";
      canonical.href = "https://alisonagomez.github.io/projects/";
      root.innerHTML = `
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="./">Início</a><span aria-hidden="true">/</span><a href="projects/">Projetos</a><span aria-hidden="true">/</span><span aria-current="page">Não encontrado</span></nav>
        <section class="detail-hero content-not-found">
          <p class="section-label">Projeto não encontrado</p>
          <h1>Este conteúdo não está disponível.</h1>
          <p class="detail-lead">O endereço pode estar incorreto ou o projeto pode ter sido removido do portfólio.</p>
          <div class="detail-top-actions"><a href="projects/">Ver projetos atuais</a><a href="./#cases">Ver cases principais</a></div>
        </section>
      `;
    }

    function renderProject(project, projects) {
      if (project.detailUrl && !project.detailUrl.startsWith("projects/")) {
        location.replace(project.detailUrl);
        return;
      }

      const details = project.details || {};
      const nextProject = projects[(projects.indexOf(project) + 1) % projects.length];
      const repository = project.repository
        ? `<a href="${escapeHtml(project.repository)}" target="_blank" rel="noreferrer">Ver repositório</a>`
        : "";
      const documentation = project.documentation
        ? `<a href="${escapeHtml(project.documentation)}" target="_blank" rel="noreferrer">Abrir documentação</a>`
        : "";

      document.title = `${project.title} | Alison Gomez`;
      canonical.href = `https://alisonagomez.github.io/projects/?id=${encodeURIComponent(project.id)}`;
      description.content = `${project.title}: ${project.benefit}`;
      root.innerHTML = `
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="./">Início</a><span aria-hidden="true">/</span><a href="projects/">Projetos</a><span aria-hidden="true">/</span><span aria-current="page">${escapeHtml(project.title)}</span></nav>
        <div class="detail-layout">
          <article class="detail-main">
            <header class="detail-hero">
              <p class="section-label">${escapeHtml(project.category)}</p>
              <h1>${escapeHtml(project.title)}</h1>
              <p class="detail-lead">${escapeHtml(project.subtitle)}</p>
              <div class="detail-meta"><span>${escapeHtml(project.status)}</span><span>${escapeHtml(project.date)}</span><span>Projeto autoral</span></div>
              <p><strong>Meu papel:</strong> ${escapeHtml(project.role)}</p>
              ${renderTags(project.tags)}
              <div class="detail-top-actions">${repository}${documentation}<a href="#evidencias">Ver evidências</a></div>
            </header>

            <nav class="detail-toc" aria-label="Sumário do projeto">
              <strong>Nesta página</strong>
              <a href="#resumo">Resumo</a><a href="#contexto">Contexto</a><a href="#implementado">Implementado</a><a href="#parcial">Em validação</a><a href="#arquitetura">Arquitetura</a><a href="#seguranca">Segurança</a><a href="#limitacoes">Limitações</a><a href="#evidencias">Evidências</a>
            </nav>

            ${renderSection("resumo", "Resumo executivo", details.overview || project.summary)}
            ${renderSection("contexto", "Contexto e problema", details.context || details.problem)}
            ${renderSection("problema", "Problema técnico", details.problem)}
            ${renderSection("implementado", "O que está implementado", details.implemented)}
            ${renderSection("parcial", "Parcialmente implementado ou em validação", details.partial)}
            ${renderSection("planejado", "Próximos passos", details.planned)}
            ${renderArchitecture(details.architecture)}
            ${renderSection("seguranca", "Decisões de segurança", details.security)}
            ${renderSection("testes", "Validação e testes", details.tests)}
            ${renderSection("resultados", "Resultados demonstrados", details.results)}
            ${renderSection("limitacoes", "Limitações", details.limitations)}
            ${renderGallery(project.gallery)}

            <section class="detail-section">
              <h2>Continuar navegando</h2>
              <p>Próximo conteúdo: <a class="text-link" href="${escapeHtml(nextProject.detailUrl)}">${escapeHtml(nextProject.title)} →</a></p>
              <div class="detail-top-actions">${repository}${documentation}<a href="projects/">Voltar ao catálogo</a></div>
            </section>
          </article>

          <aside class="detail-aside" aria-label="Resumo do projeto">
            <section class="aside-card"><h2>Benefício</h2><p>${escapeHtml(project.benefit)}</p></section>
            <section class="aside-card"><h2>Estado</h2><p><strong>${escapeHtml(project.status)}</strong></p><p>${escapeHtml(project.date)}</p></section>
            <section class="aside-card"><h2>Links</h2><div class="report-action-stack">${repository}${documentation}<a href="projects/">Catálogo</a></div></section>
          </aside>
        </div>
      `;
    }

    fetch("assets/projects/projects.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(projects => {
        if (!Array.isArray(projects) || !projects.length) throw new Error("Catálogo vazio");
        if (!projectId) {
          renderCatalog(projects);
          return;
        }
        const project = projects.find(item => item.id === projectId);
        project ? renderProject(project, projects) : renderNotFound();
      })
      .catch(error => {
        root.innerHTML = `<section class="report-empty"><h1>Não foi possível carregar os projetos.</h1><p>${escapeHtml(error.message)}</p></section>`;
      });
  </script>
</body>
</html>

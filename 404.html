<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada | Alison Gomez</title>
  <meta name="description" content="A página solicitada não foi encontrada no portfólio de Alison Gomez." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <link rel="stylesheet" href="/style.css?v=43" />
</head>
<body class="not-found-page">
  <main class="not-found-shell">
    <p class="eyebrow">Erro 404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço pode estar incorreto ou o conteúdo pode ter sido removido.</p>
    <div class="hero-actions">
      <a class="btn primary" href="/">Voltar ao início</a>
      <a class="btn secondary" href="/projects/">Ver projetos</a>
    </div>
  </main>

  <script>
    const redirects = {
      "/project": "/projects/",
      "/project/": "/projects/",
      "/report": "/reports/",
      "/report/": "/reports/",
      "/automation": "/automations/",
      "/automation/": "/automations/"
    };

    const target = redirects[window.location.pathname];

    if (target) {
      window.location.replace(target + window.location.search + window.location.hash);
    }
  </script>
</body>
</html>
